# fly.toml app configuration file generated for cuesense-pool-manager on 2026-08-08T14:25:19Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cuesense-pool-manager'
primary_region = 'lhr'

[build]

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[mounts]]
  source = "pool_league_data"
  destination = "/data"

[env]
  DATA_DIR = "/data"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[[restart]]
  policy = 'always'
  processes = ['app']
  retries = 10
